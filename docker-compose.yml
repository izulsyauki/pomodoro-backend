services:
  # Service Aplikasi Backend
  backend:
    build: .
    container_name: pomodoro_backend
    restart: always
    ports:
      - "8001:8001"
    environment:
      # Menggunakan value DATABASE_URL langsung dari .env host
      # Pastikan di .env VPS, host-nya bukan 'localhost', tapi IP private VPS atau 'host.docker.internal'
      - DATABASE_URL=${DATABASE_URL}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - JWT_ALGORITHM=${JWT_ALGORITHM:-HS256}
      - ACCESS_TOKEN_EXPIRE_MINUTES=${ACCESS_TOKEN_EXPIRE_MINUTES:-30}
      - REFRESH_TOKEN_EXPIRE_DAYS=${REFRESH_TOKEN_EXPIRE_DAYS:-7}

    # Uncomment baris di bawah jika ingin akses database di localhost VPS (Linux) dengan 'localhost'
    extra_hosts:
      - "host.docker.internal:host-gateway"